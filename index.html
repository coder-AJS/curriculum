<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.V.</title>

    <link rel="stylesheet" href="./resources/styles/main.css">
    <link rel="stylesheet" href="./resources/styles/fonts.css">
    <link rel="stylesheet" href="./resources/styles/scale.css">
    <link rel="stylesheet" href="./resources/styles/wellcome.css">
    <link rel="stylesheet" href="./resources/styles/hards.css">
    <link rel="stylesheet" href="./resources/styles/section1.css">

</head>

<body class="relative">
    <section id="wellcome" class="wellcome maxVP FCenter absolute z1">
        <div class="bg max absolute"></div>
        <div id="cubeContainer" class="cubeContainer maxVP FCenter">LOADING</div>
    </section>

    <section id="sectionScroll" class="sectionScroll relative z2">

        <section class="hards darkSection maxVP">
            <div class="sectionContent max FCenter relative">
                <h1 data-animation="appear" class="hardsTitle FCenter">HARD</h1>
                <span class="titleSpc"></span>
                <h1 data-animation="appear" class="hardsTitle FCenter">SKILLS</h1>
            </div>
        </section>

        <section id="section_1" class="section_1 scrollTempo FCenter relative">
            <div class="vpBox maxVP FCol FJ_center horLimit">
                <h2 id="hardTitle" class="hardTitle FRow FA_center"></h2>
                <ul class="cardsContainer FRow FJ_between">
                    <div class="cardScene relative">
                        <div class="bgLayer max absolute"></div>
                        <div class="cardBox max tempo700 absolute"></div>
                    </div>
                    <div class="cardScene relative">
                        <div class="bgLayer max absolute"></div>
                        <div class="cardBox max tempo700 absolute"></div>
                    </div>
                    <div class="cardScene relative">
                        <div class="bgLayer max absolute"></div>
                        <div class="cardBox max tempo700 absolute"></div>
                    </div>
                </ul>
            </div>
        </section>
    </section>

    <section id="footer" class="footer maxVP FCenter absolute z1"></section>

    <div id="scale" class="scale absolute z3">
        <div id="scrollScale" class="scrollScale FRow FJ_right tempo300 absolute">
            <ul id="marksBox" class="marksBox FCol FA_end FJ_between absolute"></ul>
        </div>
        <div id="dynamicLayer" class="dynamicLayer FCenter relative">
            <div id="view" class="view absolute"></div>
            <span class="line absolute"></span>
            <div id="info" class="info FCenter absolute"></div>
        </div>
        <div id="interLayer" class="interLayer maxVP absolute"></div>
    </div>

    <script type="module" src="./scripts/init.js"></script>
</body>

</html>
