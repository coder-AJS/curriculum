<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.V.</title>

    <link rel="stylesheet" href="./resources/styles/main.css">
    <link rel="stylesheet" href="./resources/styles/fonts.css">
    <link rel="stylesheet" href="./resources/styles/scale.css">
    <link rel="stylesheet" href="./resources/styles/wellcome.css">
    <link rel="stylesheet" href="./resources/styles/section1.css">

</head>

<body class="relative">
    <section id="wellcome" class="wellcome bg-cover maxVP FCenter absolute z1">
        <div class="filterLayer max absolute"></div>
        <div class="cubeBox relative">
            <ul class="scene3d max tempo500 relative">
                <li class="side FCenter front max absolute">1</li>
                <li class="side FCenter back max absolute">2</li>
                <li class="side FCenter top max absolute">3</li>
                <li class="side FCenter bottom max absolute">4</li>
                <li class="side FCenter left absolute">5</li>
                <li class="side FCenter right absolute">6</li>
            </ul>

            <div class="inputsBox absolute FCol FJ_between">
                <input type="range" name="" id="rangeH" min="-25" max="25">
                <input type="range" name="" id="rangeV" min="-25" max="45">
            </div>
        </div>
    </section>

    <section id="sectionScroll" class="sectionScroll relative z2">
        <section id="section-1" class="section section-1 scrollTempo FCenter relative">
            <ul class="cardsCont horLimit">
                <li class="statBox tempo500 relative">
                    <div class="bgLayer max tempo500 absolute"></div>
                    <div class="stat3d stat3dHidden max tempo1000"></div>
                </li>
                <li class="statBox tempo500 relative">
                    <div class="bgLayer max tempo500 absolute"></div>
                    <div class="stat3d stat3dHidden max tempo1000"></div>
                </li>
                <li class="statBox tempo500 relative">
                    <div class="bgLayer max tempo500 absolute"></div>
                    <div class="stat3d stat3dHidden max tempo1000"></div>
                </li>
            </ul>
        </section>
    </section>

    <section id="footer" class="footer maxVP FCenter absolute z1"></section>

    <div id="scale" class="scale absolute z3">
        <div id="scrollScale" class="scrollScale FRow FJ_right tempo300 absolute">
            <ul id="marksBox" class="marksBox FCol FA_end FJ_between absolute"></ul>
        </div>
        <div id="dynamicLayer" class="dynamicLayer FCenter relative">
            <div id="view" class="view absolute"></div>
            <span class="line absolute"></span>
            <div id="info" class="info FCenter absolute"></div>
        </div>
        <div id="interLayer" class="interLayer maxVP absolute"></div>
    </div>

    <script type="module" src="./scripts/init.js"></script>
</body>

</html>
